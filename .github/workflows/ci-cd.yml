name: CI/CD - Agritech Crop Recommender

# Déclencheurs : à chaque push et à chaque pull request ciblant main.
"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE_NAME: agritech-crop-api

jobs:
  # ------------------------------------------------------------------
  # 1) TESTS — installe les dépendances de l'API et lance les tests
  #    unitaires pytest sur les endpoints critiques (/predict, /recommend).
  # ------------------------------------------------------------------
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Lancement des tests unitaires
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ------------------------------------------------------------------
  # 2) BUILD — construit l'image Docker de l'API à chaque modification
  #    du code (garantit que le Dockerfile reste valide).
  # ------------------------------------------------------------------
  build:
    name: Build de l'image Docker (API)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image (sans push)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 3) DÉPLOIEMENT (optionnel) — publie l'image sur Docker Hub quand le
  #    code est fusionné sur main. Nécessite les secrets du dépôt GitHub :
  #    DOCKERHUB_USERNAME et DOCKERHUB_TOKEN.
  #    Streamlit Community Cloud se redéploie automatiquement dès qu'un
  #    push atteint la branche main (aucune étape supplémentaire requise
  #    une fois l'application connectée à ce dépôt sur share.streamlit.io).
  # ------------------------------------------------------------------
  deploy:
    name: Publication sur Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
